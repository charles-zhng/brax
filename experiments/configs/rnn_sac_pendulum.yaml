# Recurrent SAC (GRU) on PendulumSwingup.
algo: rnn_sac
env: pendulum
num_timesteps: 1000000
num_envs: 64
num_evals: 20
episode_length: 1000
seed: 42

network:
  cell_type: gru
  rnn_hidden_size: 128
  policy_output_layer_sizes: [128]
  q_hidden_layer_sizes: [128]

train:
  learning_rate: 3.0e-4
  discounting: 0.99
  tau: 0.005
  batch_size: 256
  unroll_length: 32
  burn_in: 0
  min_replay_size: 10000
  max_replay_size: 500000
  grad_updates_per_step: 1
  reward_scaling: 1.0
  normalize_observations: true
  deterministic_eval: true
