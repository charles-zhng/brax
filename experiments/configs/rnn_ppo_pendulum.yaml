# RNN-PPO on PendulumSwingup (vanilla RNN; reached ~108 reward).
algo: rnn_ppo
env: pendulum
num_timesteps: 10000000
num_envs: 512
num_evals: 20
episode_length: 1000
seed: 42

network:
  cell_type: simple
  policy_rnn_hidden_size: 64
  policy_output_layer_sizes: [64]

train:
  learning_rate: 1.0e-4
  entropy_cost: 0.005
  discounting: 0.99
  gae_lambda: 0.95
  unroll_length: 64
  batch_size: 512
  num_minibatches: 16
  num_updates_per_batch: 8
  max_grad_norm: 0.5
  clipping_epsilon: 0.2
  normalize_observations: true
  normalize_advantage: true
  deterministic_eval: true
