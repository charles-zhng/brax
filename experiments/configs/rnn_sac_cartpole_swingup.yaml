# Recurrent SAC (GRU) on cartpole_swingup, full obs, warp backend.
# Verified 2026-07-04: reward 810 vs ff_sac 820 (99% parity). Needs fixed
# alpha (auto-alpha plateaus ~230) and a 30M horizon (still climbing at 10M).
algo: rnn_sac
env: cartpole_swingup
num_timesteps: 30000000
num_envs: 1024
num_evals: 20
episode_length: 1000
seed: 42
env_config: {impl: warp}

network:
  cell_type: gru
  rnn_hidden_size: 128
  policy_output_layer_sizes: [128]
  q_hidden_layer_sizes: [256, 256]
  q_network_layer_norm: true
  shared_q_backbone: false

train:
  learning_rate: 1.0e-3
  discounting: 0.99
  tau: 0.005
  batch_size: 256
  unroll_length: 32
  burn_in: 0
  min_replay_size: 8192
  max_replay_size: 1000000
  grad_updates_per_step: 64
  reward_scaling: 1.0
  normalize_observations: true
  deterministic_eval: true
  # Fixed alpha=0.2: near-zero lr pins log_alpha at its init value.
  alpha_learning_rate: 1.0e-9
  init_log_alpha: -1.609
