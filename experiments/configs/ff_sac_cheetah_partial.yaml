# Feedforward SAC baseline on cheetah POMDP (flat partial obs) — expected to collapse; warp backend.
algo: ff_sac
env: cheetah_partial_flat
num_timesteps: 10000000
num_envs: 128
num_evals: 20
episode_length: 1000
seed: 42
env_config: {impl: warp}

network:
  hidden_layer_sizes: [256, 256]
  q_network_layer_norm: true

train:
  learning_rate: 1.0e-3
  discounting: 0.99
  tau: 0.005
  batch_size: 512
  min_replay_size: 8192
  max_replay_size: 1000000
  grad_updates_per_step: 8
  reward_scaling: 1.0
  normalize_observations: true
  deterministic_eval: true
